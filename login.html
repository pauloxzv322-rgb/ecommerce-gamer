<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Zone | Login</title>
    <!-- Link oficial do Bootstrap CSS para ativar o tema escuro -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-dark text-white">

    <!-- MENU -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
            <div class="container">
                <a class="navbar-brand fw-bold text-info" href="index.html">🎮 GAMER_ZONE</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="index.html">Home</a>
                        <a class="nav-link active" href="login.html">Login/Cadastro</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- FORMULÁRIO DE LOGIN -->
    <main class="container my-5 d-flex justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="card bg-black border-secondary text-white p-4 shadow-lg rounded-3" style="max-width: 450px; width: 100%;">
            <h3 class="text-center text-info fw-bold mb-4">🕹️ ÁREA DO JOGADOR</h3>
            
            <!-- Divs de Alertas controladas pelo JavaScript -->
            <div id="mensagem-erro" class="alert alert-danger d-none fw-bold small py-2 mb-3" role="alert"></div>
            <div id="mensagem-sucesso" class="alert alert-success d-none fw-bold small py-2 mb-3" role="alert"></div>

            <form id="formLogin">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">E-mail ou Usuário</label>
                    <input type="text" id="email" class="form-control bg-dark text-white border-secondary" placeholder="Digite seu e-mail gamer">
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label fw-semibold">Senha</label>
                    <input type="password" id="senha" class="form-control bg-dark text-white border-secondary" placeholder="Digite sua senha">
                </div>
                <div class="mb-3 text-end">
                    <a href="#" class="text-decoration-none text-info small">Ainda não tem conta? Cadastre-se aqui</a>
                </div>
                <button type="submit" class="btn btn-info w-100 fw-bold py-2 mt-2">ENTRAR NO SQUAD</button>
            </form>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer class="bg-black text-center py-4 border-top border-secondary fixed-bottom">
        <div class="container text-muted">
            <p class="mb-0">&copy; 2026 GAMER ZONE Ltda. Desenvolvido para a Atividade de Front-End.</p>
        </div>
    </footer>

    <!-- Scripts necessários corrigidos: Bootstrap e jQuery oficiais -->
    <script src="https://jquery.com"></script>
    <script src="https://jsdelivr.net"></script>

    <!-- [REQUISITO: JAVASCRIPT / JQUERY PARA INTERAÇÃO E VALIDAÇÃO] -->
    <script>
        $(document).ready(function() {
            // Monitora o envio (submit) do formulário
            $('#formLogin').on('submit', function(event) {
                event.preventDefault(); // Impede a página de recarregar antes da validação

                // Captura os valores digitados tirando espaços vazios
                let email = $('#email').val().trim();
                let senha = $('#senha').val().trim();

                // Esconde alertas anteriores
                $('#mensagem-erro').addClass('d-none');
                $('#mensagem-sucesso').addClass('d-none');

                // Validação: Verifica se os campos estão em branco
                if (email === "" || senha === "") {
                    $('#mensagem-erro').removeClass('d-none').text('⚠️ Por favor, preencha todos os campos para fazer o login.');
                } else if (senha.length < 6) {
                    // Validação extra: Senha muito curta
                    $('#mensagem-erro').removeClass('d-none').text('⚠️ A senha deve ter no mínimo 6 caracteres.');
                } else {
                    // Se passar nas validações, mostra sucesso
                    $('#mensagem-sucesso').removeClass('d-none').text('🎉 Login efetuado com sucesso! Redirecionando...');
                    
                    // Simula um redirecionamento após 2 segundos
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 2000);
                }
            });
        });
    </script>
</body>
</html>
